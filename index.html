<!-- ===== index.html ===== -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gmail 查詢</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 頁面主要容器 ===== -->
  <main class="container">

    <!-- ===== 頁面標題 ===== -->
    <header class="page-header">
      <div>
        <h1>Gmail 查詢</h1>
        <p>搜尋 Gmail 信件並將結果傳送到 LINE</p>
      </div>
    </header>

    <!-- ===== LIFF 連線狀態 ===== -->
    <div id="status" class="status status-loading" aria-live="polite">
      <span class="status-text">LIFF 初始化中...</span>
    </div>

    <!-- ======================================================
         日期區塊
         ====================================================== -->
    <section class="form-card">

      <div class="section-header">
        <h2>日期</h2>
        <span>查詢信件時間範圍</span>
      </div>

      <div class="form-group">
        <select id="dateType" onchange="changeDateType()">
          <option value="today">今天</option>
          <option value="yesterday">昨天</option>
          <option value="7">近 7 天</option>
          <option value="30">近 30 天</option>
          <option value="custom">自訂日期</option>
        </select>
      </div>

      <!-- ===== 自訂日期 ===== -->
      <div id="customDate" class="custom-date hidden">

        <div class="form-group">
          <label for="startDate">開始日期</label>
          <input type="date" id="startDate">
        </div>

        <div class="date-separator">至</div>

        <div class="form-group">
          <label for="endDate">結束日期</label>
          <input type="date" id="endDate">
        </div>

      </div>

    </section>


    <!-- ======================================================
         郵件篩選區塊
         ====================================================== -->
    <section class="form-card">

      <div class="section-header">
        <h2>郵件篩選</h2>
        <span>選擇額外的 Gmail 條件</span>
      </div>

      <!-- ===== 未讀 ===== -->
      <label class="option-row">
        <span class="option-text">
          <strong>只看未讀信</strong>
          <small>只搜尋尚未閱讀的郵件</small>
        </span>

        <span class="check-box">
          <input type="checkbox" id="unread">
          <span class="check-ui"></span>
        </span>
      </label>

      <!-- ===== 附件 ===== -->
      <label class="option-row">
        <span class="option-text">
          <strong>只看有附件的信件</strong>
          <small>只搜尋包含附件的郵件</small>
        </span>

        <span class="check-box">
          <input type="checkbox" id="attachment">
          <span class="check-ui"></span>
        </span>
      </label>

    </section>


    <!-- ======================================================
         寄件者區塊
         ====================================================== -->
    <section class="form-card">

      <div class="section-header">
        <h2>寄件者</h2>
        <span>指定郵件寄件者</span>
      </div>

      <div class="form-group">
        <input
          type="text"
          id="from"
          placeholder="例如：google.com 或 xxx@gmail.com"
        >
      </div>

    </section>


    <!-- ======================================================
         主旨區塊
         ====================================================== -->
    <section class="form-card">

      <div class="section-header">
        <h2>主旨關鍵字</h2>
        <span>搜尋郵件主旨</span>
      </div>

      <div class="form-group">
        <input
          type="text"
          id="subject"
          placeholder="例如：訂單"
        >
      </div>

    </section>


    <!-- ======================================================
         內容關鍵字區塊
         ====================================================== -->
    <section class="form-card">

      <div class="section-header">
        <h2>內容關鍵字</h2>
        <span>搜尋郵件內文</span>
      </div>

      <div class="form-group">
        <input
          type="text"
          id="keyword"
          placeholder="例如：付款"
        >
      </div>

    </section>


    <!-- ======================================================
         AI 摘要區塊
         ====================================================== -->
    <section class="ai-card">

      <div class="ai-header">

        <div class="ai-title">
          <span class="ai-label">AI</span>

          <div>
            <h2>AI 智慧摘要</h2>
            <p>使用 Gemini 整理郵件內容</p>
          </div>
        </div>

        <!-- ===== AI 開關 ===== -->
        <label class="switch">
          <input type="checkbox" id="useAI">
          <span class="slider"></span>
        </label>

      </div>

      <div class="ai-description">
        每次查詢會隨機使用不同 AI 人格，產生不同風格的摘要。
      </div>

    </section>


    <!-- ======================================================
         查詢按鈕
         ====================================================== -->
    <button
      id="searchBtn"
      class="search-btn"
      onclick="searchGmail()"
      disabled
    >
      <span>開始查詢</span>
    </button>


    <!-- ======================================================
         Gmail Query 預覽
         ====================================================== -->
    <section id="queryPanel" class="query-panel hidden">

      <div class="query-header">
        <h2>Gmail Query</h2>
        <span>實際送出的搜尋條件</span>
      </div>

      <div id="queryPreview" class="query-text"></div>

    </section>


    <!-- ===== 頁尾 ===== -->
    <footer class="page-footer">
      Gmail AI Assistant
    </footer>

  </main>


  <!-- ===== LINE LIFF SDK ===== -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- ===== 專案設定 ===== -->
  <script src="config.js"></script>

  <!-- ===== 頁面 JavaScript ===== -->
  <script src="app.js"></script>

</body>
</html>
